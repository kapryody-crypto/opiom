<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Opiom — Espace de travail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1815;
    --ink-2:#221E19;
    --surface:#28231D;
    --surface-2:#332C23;
    --border:#463D31;
    --border-soft:#3A3226;
    --cream:#F2ECE1;
    --cream-dim:#B4A997;
    --cream-faint:#7E7566;
    --poppy:#C6472E;
    --poppy-soft:rgba(198,71,46,.16);
    --gold:#D4A94C;
    --gold-soft:rgba(212,169,76,.16);
    --sage:#82A488;
    --sage-soft:rgba(130,164,136,.16);
    --slate:#7C97AC;
    --slate-soft:rgba(124,151,172,.16);
    --shadow: 0 12px 32px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--poppy);color:var(--cream);}
  a{color:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;font-weight:600;letter-spacing:-.01em;}

  /* ---------- layout ---------- */
  #app{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--ink-2);
    border-right:1px solid var(--border-soft);
    display:flex;flex-direction:column;
    padding:26px 18px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 4px 26px 4px;border-bottom:1px solid var(--border-soft);margin-bottom:18px;}
  .pod{width:26px;height:26px;flex-shrink:0;position:relative;}
  .pod svg{width:100%;height:100%;}
  .brand-text{display:flex;flex-direction:column;line-height:1;}
  .brand-text b{font-family:'Fraunces',serif;font-size:19px;letter-spacing:.04em;}
  .brand-text span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-faint);margin-top:4px;}

  nav.tabs{display:flex;flex-direction:column;gap:2px;}
  .tab-btn{
    display:flex;align-items:center;gap:10px;
    text-align:left;background:none;border:none;color:var(--cream-dim);
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:500;
    padding:10px 12px;border-radius:8px;cursor:pointer;
    border-left:2px solid transparent;transition:.15s ease;
  }
  .tab-btn:hover{background:var(--surface);color:var(--cream);}
  .tab-btn.active{background:var(--surface);color:var(--cream);border-left:2px solid var(--poppy);}
  .tab-btn .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0;}

  .sidebar-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border-soft);}
  .sidebar-foot p{font-size:11px;color:var(--cream-faint);line-height:1.5;margin:0;}

  .main{flex:1;min-width:0;padding:30px 40px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:28px;flex-wrap:wrap;}
  .topbar h1{font-size:26px;}
  .topbar .sub{color:var(--cream-faint);font-size:13px;margin-top:6px;}
  .top-actions{display:flex;gap:10px;align-items:center;}

  .btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    border-radius:8px;padding:9px 15px;border:1px solid var(--border);
    background:var(--surface);color:var(--cream);cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:.15s ease;white-space:nowrap;
  }
  .btn:hover{border-color:var(--cream-faint);}
  .btn-primary{background:var(--poppy);border-color:var(--poppy);color:#fff;}
  .btn-primary:hover{background:#b03e28;border-color:#b03e28;}
  .btn-ghost{background:none;border:1px solid var(--border-soft);}
  .btn-danger{background:none;border:1px solid var(--poppy);color:var(--poppy);}
  .btn-danger:hover{background:var(--poppy-soft);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  .btn-icon{width:34px;height:34px;padding:0;justify-content:center;border-radius:8px;}

  /* ---------- kanban ---------- */
  .board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px;}
  .col{background:var(--ink-2);border:1px solid var(--border-soft);border-radius:12px;padding:14px;min-width:220px;display:flex;flex-direction:column;}
  .col-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .col-title{font-size:12px;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:7px;}
  .col-title .seed{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .col-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cream-faint);background:var(--surface);padding:2px 7px;border-radius:20px;}
  .col-cards{display:flex;flex-direction:column;gap:10px;min-height:40px;}
  .card{
    background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;
    padding:12px 13px;cursor:pointer;transition:.15s ease;
  }
  .card:hover{border-color:var(--cream-faint);transform:translateY(-1px);box-shadow:var(--shadow);}
  .card .p-name{font-size:13.5px;font-weight:600;margin-bottom:3px;line-height:1.3;}
  .card .p-client{font-size:12px;color:var(--cream-faint);margin-bottom:9px;}
  .card .p-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--cream-dim);}
  .card .p-meta .late{color:var(--poppy);font-weight:600;}
  .bar{height:4px;border-radius:3px;background:var(--border);overflow:hidden;margin:8px 0;}
  .bar-fill{height:100%;background:var(--gold);border-radius:3px;}
  .empty-col{color:var(--cream-faint);font-size:12px;padding:14px 4px;text-align:center;border:1px dashed var(--border-soft);border-radius:8px;}

  /* ---------- table ---------- */
  .panel{background:var(--ink-2);border:1px solid var(--border-soft);border-radius:12px;padding:20px;}
  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  select, input, textarea{
    font-family:'Inter',sans-serif;background:var(--surface);border:1px solid var(--border);
    color:var(--cream);border-radius:7px;padding:8px 11px;font-size:13px;outline:none;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--gold);}
  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--cream-faint);font-weight:600;padding:0 12px 10px;border-bottom:1px solid var(--border-soft);
  }
  td{padding:13px 12px;border-bottom:1px solid var(--border-soft);font-size:13px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.row:hover{background:var(--surface);cursor:pointer;}
  .t-name{font-weight:600;}
  .t-client{color:var(--cream-faint);font-size:12px;}

  .pill{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;
    padding:4px 10px;border-radius:20px;white-space:nowrap;
  }
  .pill .seed{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .pill-actif{background:var(--slate-soft);color:var(--slate);}
  .pill-completion{background:var(--gold-soft);color:var(--gold);}
  .pill-pret{background:var(--sage-soft);color:var(--sage);}
  .pill-livre{background:rgba(180,169,151,.16);color:var(--cream-dim);}
  .pill-modification{background:var(--poppy-soft);color:var(--poppy);}
  .pill-nouvelle{background:var(--slate-soft);color:var(--slate);}
  .pill-en_cours{background:var(--gold-soft);color:var(--gold);}
  .pill-terminee{background:var(--sage-soft);color:var(--sage);}

  /* ---------- cards grid (clients / equipe) ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .entity-card{background:var(--ink-2);border:1px solid var(--border-soft);border-radius:12px;padding:18px;cursor:pointer;transition:.15s ease;}
  .entity-card:hover{border-color:var(--cream-faint);transform:translateY(-1px);box-shadow:var(--shadow);}
  .entity-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .avatar{
    width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:14px;color:var(--gold);flex-shrink:0;
  }
  .entity-card h3{font-size:15px;margin-bottom:2px;}
  .entity-card .role{font-size:12px;color:var(--cream-faint);}
  .entity-line{font-size:12.5px;color:var(--cream-dim);margin-top:6px;display:flex;gap:7px;align-items:baseline;}
  .entity-line b{color:var(--cream-faint);font-weight:600;min-width:64px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  .workload{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--cream-faint);}
  .workload b{color:var(--gold);font-family:'IBM Plex Mono',monospace;}

  .demande-card{background:var(--ink-2);border:1px solid var(--border-soft);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
  .demande-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
  .demande-top h3{font-size:14.5px;}
  .demande-proj{font-size:11.5px;color:var(--gold);margin-top:3px;}
  .demande-desc{font-size:12.5px;color:var(--cream-dim);margin-top:8px;line-height:1.5;}
  .checklist{margin-top:12px;display:flex;flex-direction:column;gap:6px;}
  .check-item{display:flex;align-items:center;gap:9px;font-size:12.5px;cursor:pointer;}
  .check-item input{accent-color:var(--gold);width:14px;height:14px;cursor:pointer;}
  .check-item.done span{text-decoration:line-through;color:var(--cream-faint);}
  .check-progress{font-size:11px;color:var(--cream-faint);margin-top:2px;}
  .demande-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border-soft);}
  .demande-foot .date{font-size:11px;color:var(--cream-faint);}

  /* ---------- section head ---------- */
  .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .section-head h2{font-size:18px;}
  .empty-state{padding:50px 20px;text-align:center;color:var(--cream-faint);font-size:13px;border:1px dashed var(--border-soft);border-radius:12px;}

  /* ---------- modal ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(10,8,6,.6);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
    animation:fade .15s ease;
  }
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .modal{
    background:var(--ink-2);border:1px solid var(--border-soft);border-radius:14px;
    width:520px;max-width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);
    animation:pop .16s ease;
  }
  @keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border-soft);}
  .modal-head h2{font-size:16.5px;}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .field label{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--cream-faint);margin-bottom:6px;}
  .field input, .field select, .field textarea{width:100%;}
  .field textarea{resize:vertical;min-height:64px;font-family:'Inter',sans-serif;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-foot{display:flex;justify-content:space-between;gap:10px;padding:16px 22px 20px;border-top:1px solid var(--border-soft);}
  .checklist-edit{display:flex;flex-direction:column;gap:8px;}
  .checklist-edit .row{display:flex;gap:8px;align-items:center;}
  .checklist-edit .row input[type=text]{flex:1;}
  .checklist-edit .del{background:none;border:none;color:var(--cream-faint);cursor:pointer;font-size:16px;line-height:1;padding:4px;}
  .checklist-edit .del:hover{color:var(--poppy);}

  /* ---------- journal ---------- */
  .journal-day{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--cream-faint);font-weight:600;margin:20px 0 8px;}
  .journal-day:first-child{margin-top:0;}
  .journal-item{display:flex;align-items:flex-start;gap:11px;padding:11px 4px;border-bottom:1px solid var(--border-soft);}
  .journal-item:last-child{border-bottom:none;}
  .journal-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0;}
  .journal-text{flex:1;font-size:13px;line-height:1.55;color:var(--cream-dim);}
  .journal-text b{color:var(--cream);}
  .journal-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cream-faint);white-space:nowrap;margin-top:3px;}

  /* ---------- name modal ---------- */
  .name-note{font-size:12px;color:var(--cream-faint);margin:0;line-height:1.5;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--surface-2);border:1px solid var(--border);color:var(--cream);
    padding:10px 18px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;
    transition:.25s ease;z-index:200;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #toast.err{border-color:var(--poppy);color:var(--poppy);}

  /* ---------- responsive ---------- */
  @media (max-width:880px){
    #app{flex-direction:column;}
    .sidebar{width:100%;height:auto;position:relative;flex-direction:row;align-items:center;padding:14px 16px;overflow-x:auto;}
    .brand{border:none;padding:0 14px 0 0;margin:0;}
    nav.tabs{flex-direction:row;}
    .sidebar-foot{display:none;}
    .main{padding:22px 18px 50px;}
    .board{grid-template-columns:repeat(5,220px);}
    .field-row{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js"></script>
<script>
/* OPIOM Auth: renseigner l'URL et la clé publique Supabase (jamais service_role). */
window.OPIOM_CONFIG = {url: "https://vzhoglufkwxliifdyanq.supabase.co", anonKey: "sb_publishable_7WABQEQaX7kzq2OFG8kXZA_1XPK9Pw3"};
</script>
<style>
#auth-gate{position:fixed;inset:0;background:#1b1815;color:#f2ece1;z-index:99999;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;padding:24px}
#auth-card{width:min(440px,100%);padding:32px;border:1px solid #463d31;border-radius:20px;background:#28231d}
#auth-card h1{margin:0 0 12px;font-size:27px}#auth-card p{color:#b4a997}
#auth-card input{display:block;width:100%;margin:12px 0;padding:14px;background:#1b1815;border:1px solid #463d31;color:white;border-radius:9px}
#auth-card button{padding:13px 18px;background:#c6472e;color:white;border:0;border-radius:9px;cursor:pointer}
#auth-card small{display:block;margin-top:12px;color:#f3b19f}
#logout-opiom{position:fixed;right:16px;bottom:16px;z-index:9000;background:#c6472e;color:white;border:0;border-radius:9px;padding:10px;cursor:pointer}
</style>
<div id="auth-gate"><div id="auth-card"><h1>OPIOM · Connexion</h1><p>Accès réservé aux collaborateurs autorisés.</p><form id="auth-form"><input id="auth-email" type="email" autocomplete="username" placeholder="Adresse email" required><input id="auth-password" type="password" autocomplete="current-password" placeholder="Mot de passe" required><button type="submit">Se connecter</button></form><button type="button" id="forgot-password" style="margin-top:12px;background:transparent;color:#f3b19f;padding:8px 0;text-decoration:underline">Mot de passe oublié ?</button><div id="reset-password-panel" hidden><p>Choisis un nouveau mot de passe.</p><form id="reset-password-form"><input id="new-password" type="password" minlength="8" autocomplete="new-password" placeholder="Nouveau mot de passe (8 caractères minimum)" required><button type="submit">Enregistrer le nouveau mot de passe</button></form></div><small id="auth-error" role="alert"></small></div></div>
<script>
window.opiomReady=(async()=>{
 const cfg=window.OPIOM_CONFIG;
 const error=document.getElementById('auth-error');
 if(!cfg.url.startsWith('https://')||!cfg.anonKey.startsWith('sb_publishable_')){error.textContent='Configuration Supabase manquante. Voir README.md';return new Promise(()=>{});}
 const sb=window.supabase.createClient(cfg.url,cfg.anonKey);
 window.opiomSupabase=sb;
 async function check(){
  const {data:{user},error:e}=await sb.auth.getUser();
  if(e||!user)return false;
  const {data:profile,error:pe}=await sb.from('profiles').select('role,active,display_name').eq('id',user.id).single();
  if(pe||!profile?.active){error.textContent='Compte non activé. Contactez un administrateur.';await sb.auth.signOut();return false;}
  window.opiomProfile=profile;window.opiomUser=user;
  document.getElementById('auth-gate').remove();
  const logout=document.createElement('button');logout.id='logout-opiom';logout.textContent='Déconnexion';
  logout.onclick=async()=>{await sb.auth.signOut();location.reload()};document.body.appendChild(logout);
  return true;
 }
 const resetPanel=document.getElementById('reset-password-panel');
 const params=new URLSearchParams(location.hash.slice(1));
 if(params.get('type')==='recovery')resetPanel.hidden=false;
 sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){resetPanel.hidden=false;error.textContent='Définis ton nouveau mot de passe ci-dessous.';}});
 document.getElementById('forgot-password').onclick=async()=>{
  const email=document.getElementById('auth-email').value.trim();
  if(!email){error.textContent='Saisis ton adresse email avant de demander la récupération.';return;}
  error.textContent='Envoi du lien de récupération…';
  const {error:e}=await sb.auth.resetPasswordForEmail(email,{redirectTo:'https://kapryody-crypto.github.io/opiom/'});
  error.textContent=e?('Envoi impossible : '+e.message):'Si cette adresse possède un compte, un email de récupération a été envoyé. Vérifie aussi les spams.';
 };
 document.getElementById('reset-password-form').onsubmit=async ev=>{
  ev.preventDefault();error.textContent='Enregistrement…';
  const {error:e}=await sb.auth.updateUser({password:document.getElementById('new-password').value});
  if(e){error.textContent=e.message;return;}
  history.replaceState(null,'',location.pathname);resetPanel.hidden=true;error.textContent='Mot de passe mis à jour. Connexion en cours…';
  if(await check())window.location.reload();
 };
 if(await check())return;
 return new Promise(resolve=>{
  document.getElementById('auth-form').onsubmit=async ev=>{
   ev.preventDefault();error.textContent='Connexion en cours…';
   const {error:e}=await sb.auth.signInWithPassword({email:document.getElementById('auth-email').value,password:document.getElementById('auth-password').value});
   if(e){error.textContent= e.message || 'Connexion impossible. Vérifiez votre email et votre mot de passe.';return;}
   if(await check())resolve();
  };
 });
})();
</script>

<script>
/* ============ CONFIG ============ */
const TABS = [
  {id:'dashboard', label:'Tableau de bord', sub:"Vue d'ensemble de l'activité de l'agence"},
  {id:'suivi', label:'Suivi de projet', sub:"Progression, échéances et charge de travail"},
  {id:'demandes', label:'Demandes & checklists', sub:"Ce qui est attendu, et où ça en est"},

 }

/* ============ STORAGE ============ */
async function loadKey(key, seed){
  try{
    const r = await window.storage.get(key, true);
    if(r && r.value) return JSON.parse(r.value);
    await window.storage.set(key, JSON.stringify(seed), true);
    return JSON.parse(JSON.stringify(seed));
  }catch(e){
    try{ await window.storage.set(key, JSON.stringify(seed), true); }catch(e2){}
    return JSON.parse(JSON.stringify(seed));
  }
}
async function saveKey(key, value, silent){
  try{
    await window.storage.set(key, JSON.stringify(value), true);
    if(!silent) showToast('Enregistré — visible par toute l\'équipe');
  }catch(e){
    if(!silent) showToast('Échec de l\'enregistrement, réessayez', true);
  }
}
async function loadAll(){
  [projects, clients, team, demandes, activity] = await Promise.all([
    loadKey('opiom:projects', []),
    loadKey('opiom:clients', []),
    loadKey('opiom:team', []),
    loadKey('opiom:demandes', []),
    loadKey('opiom:activity', []),
  ]);
}
async function logActivity(entity, sentence){
  activity.unshift({id: uid(), ts: Date.now(), auteur: myName || 'Quelqu\'un', entity, sentence});
  activity = activity.slice(0, 300);
  await saveKey('opiom:activity', activity, true);
}
async function ensureName(){
  try{
    const r = await window.storage.get('opiom:my-name', false);
    if(r && r.value){ myName = r.value; return; }
  }catch(e){}

}
function promptName(){
  return new Promise(resolve=>{
    document.getElementById('modal-root').innerHTML = `
      <div class="backdrop">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-head"><h2>Bienvenue dans l'espace Opiom</h2></div>

/* ============ HELPERS ============ */
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'});
}
function isLate(dateLimite, statut){
  if(statut === 'livre') return false;
  const dt = new Date(dateLimite + 'T00:00:00');
  if(isNaN(dt)) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return dt < today;
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function initials(name){
  return (name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
}
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', !!isErr);
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 2200);
}
function dayLabel(ts){
  const d = new Date(ts);
  const today = new Date(); today.setHours(0,0,0,0);
  const yest = new Date(today); yest.setDate(yest.getDate()-1);
  const dOnly = new Date(d); dOnly.setHours(0,0,0,0);
  if(dOnly.getTime()===today.getTime()) return "Aujourd'hui";
  if(dOnly.getTime()===yest.getTime()) return 'Hier';
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'long', year:'numeric'});
}
function pill(map, key){
  const s = map[key] || {label:key, css:key};
  return `<span class="pill pill-${s.css}"><span class="seed" style="background:currentColor"></span>${s.label}</span>`;
}

/* ============ JOURNAL D'ACTIVITÉ ============ */
function renderJournal(){
  if(!activity.length){
    document.getElementById('tab-content').innerHTML = `<div class="empty-state">Aucune activité pour l'instant. Chaque création, modification ou suppression apparaîtra ici automatiquement, pour toute l'équipe.</div>`;
    return;
  }
  const colors = {projet:'var(--slate)', demande:'var(--gold)', client:'var(--sage)', equipe:'var(--poppy)', checklist:'var(--cream-dim)'};
  let lastLabel = null;
  let rows = '';
  activity.forEach(a=>{
    const label = dayLabel(a.ts);
    if(label !== lastLabel){ rows += `<div class="journal-day">${label}</div>`; lastLabel = label; }
    const time = new Date(a.ts).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    rows += `
      <div class="journal-item">
        <span class="journal-dot" style="background:${colors[a.entity] || 'var(--cream-faint)'}"></span>
        <span class="journal-text"><b>${escapeHtml(a.auteur)}</b> ${escapeHtml(a.sentence)}</span>
        <span class="journal-time">${time}</span>
      </div>`;
  });
  document.getElementById('tab-content').innerHTML = `<div class="panel">${rows}</div>`;
}

async function toggleCheck(demandeId, idx){

async function submitProject(form){
  const id = form.dataset.id;
  const fd = new FormData(form);
  const data = {
    nomProjet: fd.get('nomProjet').trim(),
    client: fd.get('client').trim(),
    dateLimite: fd.get('dateLimite'),
    statut: fd.get('statut'),
    avancement: Math.max(0, Math.min(100, Number(fd.get('avancement')) || 0)),
    charge: fd.get('charge').trim(),
    notes: fd.get('notes').trim(),
  };
  if(id){
    Object.assign(projects.find(p=>p.id===id), data);

    projects.push({id: uid(), ...data});
    await saveKey('opiom:projects', projects);
    await logActivity('projet', `a créé le projet « ${data.nomProjet} » pour ${data.client}`);

  closeModal();
  renderCurrent();
}
async function deleteProject(id){
  if(!confirm('Supprimer ce projet ?')) return;

/* -- Demande modal -- */
function openDemandeModal(id){
  const d = id ? demandes.find(x=>x.id===id) : null;
  modalChecklist = d ? JSON.parse(JSON.stringify(d.checklist)) : [];
  openModalShell(d ? 'Modifier la demande' : 'Nouvelle demande', `
    <form id="demande-form" data-id="${d?d.id:''}">
      <div class="modal-body">
        <div class="field"><label>Titre</label><input required name="titre" value="${d?escapeHtml(d.titre):''}" placeholder="Ex. Valider les maquettes"></div>
        <div class="field"><label>Projet lié</label>
          <input list="proj-list" name="projet" value="${d?escapeHtml(d.projet||''):''}" placeholder="Optionnel">
          <datalist id="proj-list">${projects.map(p=>`<option value="${escapeHtml(p.nomProjet)}">`).join('')}</datalist>
        </div>
        <div class="field-row">
          <div class="field"><label>Statut</label><select name="statut">${Object.entries(STATUTS_DEMANDE).map(([k,v])=>`<option value="${k}" ${d&&d.statut===k?'selected':''}>${v.label}</option>`).join('')}</select></div>
          <div class="field"><label>Date</label><input type="date" name="date" value="${d?d.date:new Date().toISOString().slice(0,10)}"></div>
        </div>
        <div class="field"><label>Description</label><textarea name="description" placeholder="Détails de la demande...">${d?escapeHtml(d.description||''):''}</textarea></div>
        <div class="field">
          <label>Checklist</label>
          <div class="checklist-edit" id="checklist-edit"></div>
          <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px" id="add-check-item">+ Ajouter une tâche</button>
        </div>
      </div>
    </form>
  `, `
    <div class="modal-foot">
      ${d ? `<button class="btn btn-danger" data-action="delete-demande" data-id="${d.id}">Supprimer</button>` : `<span></span>`}
      <button class="btn btn-primary" type="submit" form="demande-form">${d?'Enregistrer':'Créer la demande'}</button>
    </div>
  `);
  renderChecklistEdit();
  document.getElementById('add-check-item').addEventListener('click', ()=>{
    modalChecklist.push({t:'', done:false});
    renderChecklistEdit();
  });
}
function renderChecklistEdit(){
  const box = document.getElementById('checklist-edit');
  box.innerHTML = modalChecklist.map((c,idx)=>`
    <div class="row">
      <input type="checkbox" data-ci="${idx}" class="ci-check" ${c.done?'checked':''}>
      <input type="text" data-ci="${idx}" class="ci-text" value="${escapeHtml(c.t)}" placeholder="Tâche à faire">
      <button type="button" class="del" data-ci="${idx}">✕</button>
    </div>`).join('') || `<div style="font-size:12px;color:var(--cream-faint)">Aucune tâche pour le moment.</div>`;
  box.querySelectorAll('.ci-check').forEach(el=>el.addEventListener('change', e=>{
    modalChecklist[+e.target.dataset.ci].done = e.target.checked;
  }));
  box.querySelectorAll('.ci-text').forEach(el=>el.addEventListener('input', e=>{
    modalChecklist[+e.target.dataset.ci].t = e.target.value;
  }));
  box.querySelectorAll('.del').forEach(el=>el.addEventListener('click', e=>{
    modalChecklist.splice(+e.target.dataset.ci, 1);
    renderChecklistEdit();
  }));
}
async function submitDemande(form){

/* ============ EVENT DELEGATION ============ */
document.addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if(action === 'nav') switchTab(btn.dataset.tab);
  else if(action === 'close-modal'){ if(e.target === btn) closeModal(); }
  else if(action === 'new-project') openProjectModal();
  else if(action === 'edit-project') openProjectModal(id);
  else if(action === 'delete-project') await deleteProject(id);
  else if(action === 'new-demande') openDemandeModal();
  else if(action === 'edit-demande') openDemandeModal(id);
  else if(action === 'delete-demande') await deleteDemande(id);
  else if(action === 'new-client') openClientModal();
  else if(action === 'edit-client') openClientModal(id);
  else if(action === 'delete-client') await deleteClient(id);
  else if(action === 'new-team') openTeamModal();
  else if(action === 'edit-team') openTeamModal(id);
  else if(action === 'delete-team') await deleteTeam(id);
  else if(action === 'refresh'){ await loadAll(); renderCurrent(); showToast('Données actualisées'); }
});
document.addEventListener('change', async (e)=>{
  if(e.target.dataset.action === 'toggle-check'){
    await toggleCheck(e.target.dataset.id, +e.target.dataset.idx);
  }
});
document.addEventListener('submit', async (e)=>{
  e.preventDefault();
  const form = e.target;
  if(form.id === 'project-form') await submitProject(form);
  else if(form.id === 'demande-form') await submitDemande(form);
  else if(form.id === 'client-form') await submitClient(form);
  else if(form.id === 'team-form') await submitTeam(form);
});

/* ============ INIT ============ */
(async function init(){
  await window.opiomReady;
  await ensureName();
  await loadAll();
  switchTab('dashboard');
})();
</script>
